name: Train and benchmark AAI

on:
  workflow_dispatch:
    inputs:
      episodes:
        description: Training episodes
        required: true
        default: '360'
        type: string
      evaluation_episodes:
        description: Held-out seeds per fleet size
        required: true
        default: '20'
        type: string
  push:
    paths:
      - '.github/experiment_trigger'

permissions:
  contents: write

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Train DQN for 360 full-day episodes
        run: OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m backend.train --episodes ${{ inputs.episodes || '360' }} --seed 42 --day-minutes 1440 --fleet-size 8 --learn-every 4
      - name: Fit demand forecast on training days
        run: python -m backend.coordination.predictive --seed-start 42 --days 130
      - name: Select incoming controller on separate validation seeds
        run: OMP_NUM_THREADS=1 python -m backend.tune_incoming
      - name: Run held-out full-day fleet/peak benchmark
        run: OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m backend.compare_incoming --episodes ${{ inputs.evaluation_episodes || '20' }}
      - name: Upload model and experiment results
        uses: actions/upload-artifact@v4
        with:
          name: aai-training-results
          path: |
            models/dqn_latest.pt
            models/demand_forecast.json
            models/incoming_config.json
            results/*.json
            results/*.csv
            results/incoming_summary.md
      - name: Publish experiment outputs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/dqn_latest.pt models/demand_forecast.json models/incoming_config.json results/experiment_results.json results/experiment_results.csv results/training_curve.json results/incoming_review.json results/incoming_validation.json results/incoming_summary.md
          git diff --cached --quiet || git commit -m "Publish full-day DQN benchmark"
          git push
