name: Train and benchmark AAI

on:
  workflow_dispatch:
    inputs:
      episodes:
        description: Training days per model
        required: true
        default: '240'
        type: string
      evaluation_episodes:
        description: Held-out demand days per fleet size
        required: true
        default: '20'
        type: string
  push:
    paths:
      - '.github/experiment_trigger'

permissions:
  contents: write

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Train DQN, DQN+Matching (3 seeds each) and VDN
        run: ./scripts/train_all.sh ${{ inputs.episodes || '240' }}
      - name: Fit demand forecast on training days
        run: python -m backend.coordination.predictive --seed-start 42 --days 130
      - name: Run held-out full-day benchmark
        run: OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m backend.benchmark --episodes ${{ inputs.evaluation_episodes || '20' }}
      - name: Export policy replays and bundle static research data
        run: |
          OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m backend.export_replay
          python scripts/bundle_research.py
      - name: Upload model and experiment results
        uses: actions/upload-artifact@v4
        with:
          name: aai-training-results
          path: |
            models/*.pt
            models/demand_forecast.json
            models/incoming_config.json
            results/*.json
            results/*.csv
            results/summary.md
      - name: Publish experiment outputs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/*.pt models/demand_forecast.json models/incoming_config.json results/experiment_results.json results/experiment_results.csv results/training_curve_*.json results/summary.md
          git add frontend/data
          git diff --cached --quiet || git commit -m "Publish benchmark with learned agents"
          git push
