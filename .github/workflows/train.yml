name: Train and benchmark AAI

on:
  workflow_dispatch:
    inputs:
      episodes:
        description: Training episodes
        required: true
        default: '360'
        type: string
      evaluation_episodes:
        description: Held-out full-day evaluation episodes
        required: true
        default: '20'
        type: string
  push:
    paths:
      - '.github/experiment_trigger'

permissions:
  contents: write

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train DQN for 360 full-day episodes
        run: python -m backend.train --episodes ${{ inputs.episodes || '360' }} --seed 42

      - name: Run held-out full-day benchmark
        run: python -m backend.experiment --episodes ${{ inputs.evaluation_episodes || '20' }}

      - name: Upload model and experiment results
        uses: actions/upload-artifact@v4
        with:
          name: aai-training-results
          path: |
            models/dqn_latest.pt
            results/*.json
            results/*.csv

      - name: Publish experiment outputs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/dqn_latest.pt results/*.json results/*.csv
          git diff --cached --quiet || git commit -m "Publish 360-episode full-day DQN benchmark"
          git push
